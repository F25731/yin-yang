name: Validate corpus

on:
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "metadata/**"
      - "indexes/**"
      - "ai/**"
      - "sources/**"
      - "tools/**"
      - "CATALOG.md"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "metadata/**"
      - "indexes/**"
      - "ai/**"
      - "sources/**"
      - "tools/**"
      - "CATALOG.md"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/validate.yml"

concurrency:
  group: validate-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate corpus
        run: python tools/validate_all.py
